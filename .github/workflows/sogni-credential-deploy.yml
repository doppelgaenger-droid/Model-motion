name: Sogni Credential Function Deploy
on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type model-motion (manual deploy, no generations)"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: model-motion-sogni-credential-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_project == 'model-motion'
    runs-on: ubuntu-latest
    environment: firebase-production-functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check safe check-only endpoint
        run: |
          node --check functions/sogni-check/index.js
          node -e 'const c=require("./firebase.json");if(!c.functions?.some(f=>f.codebase==="sogni-check"&&f.source==="functions/sogni-check")||c.storage?.[0]?.target!=="main")process.exit(1)'
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: model-motion
      - name: Install dependencies
        working-directory: functions/sogni-check
        run: npm install --no-audit --no-fund
      - name: Deploy credential check function only
        run: npx --yes firebase-tools@14 deploy --only functions:sogni-check:sogniCredentialCheckEu --project model-motion --non-interactive
